name: Build Linux Binary

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Run tests
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q

      - name: Build binary with PyInstaller
        run: |
          pip install -r requirements.txt -r requirements-build.txt
          pyinstaller --onefile -n helm-mirror src/main.py
          ./dist/helm-mirror --help > /dev/null
          (cd dist && sha256sum helm-mirror > helm-mirror.sha256)

      - name: Scan binary with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: dist/helm-mirror
          format: sarif
          output: trivy-binary.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload Trivy binary scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always() && hashFiles('trivy-binary.sarif') != ''
        with:
          sarif_file: trivy-binary.sarif
          category: trivy-binary

      - name: Upload binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helm-mirror-linux-amd64
          path: |
            dist/helm-mirror
            dist/helm-mirror.sha256
          if-no-files-found: error

  # Only this job can write to the repository, and only for tag builds.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: helm-mirror-linux-amd64
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/helm-mirror
            dist/helm-mirror.sha256
          generate_release_notes: true
