name: Rebuild Latest Image Schedule

on:
  schedule:
    - cron: "0 */6 * * *" # Every six hours
  workflow_dispatch:

concurrency:
  group: schedule-rebuild
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Base image packages change independently of this repo, so do not reuse
      # cached layers; otherwise `apk upgrade` would never see new packages.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          pull: true
          no-cache: true
          tags: ghcr.io/${{ github.repository }}:latest

      - name: Smoke test image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}:latest
          docker run --rm "$IMAGE" --help > /dev/null
          docker run --rm --entrypoint sh "$IMAGE" -c \
            'test "$(id -u)" != 0 && helm version --short && crane version && skopeo --version && yq --version'

      # Never replace a working :latest with an image that has a fixable HIGH/CRITICAL CVE.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:latest
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Push image
        run: docker push ghcr.io/${{ github.repository }}:latest
